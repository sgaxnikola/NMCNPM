services:
  mysql:
    image: mysql:8.4
    container_name: bluemoon-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bluemoon
      MYSQL_USER: bluemoon_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - bluemoon_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bluemoon-api
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - bluemoon_net

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bluemoon-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - bluemoon_net

networks:
  bluemoon_net:
    driver: bridge

volumes:
  mysql_data:

